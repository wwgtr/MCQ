<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيف علي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #1e1135 0%, #0b0518 70%, #020107 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* تأثير زجاج الآيفون الفاخر */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(18, 10, 36, 0.35);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(236, 72, 153, 0.15);
            border-radius: 28px;
            padding: 55px 45px;
            text-align: center;
            width: 90%;
            max-width: 430px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.2),
                        inset 0 -1px 20px rgba(168, 85, 247, 0.1);
            transform-style: preserve-3d;
            transform: translateZ(30px);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
            overflow: hidden;
        }

        /* خط اللمعان المتحرك على الزجاج */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.12) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: lightGlow 6s infinite linear;
            pointer-events: none;
        }

        @keyframes lightGlow {
            0% { left: -60%; }
            100% { left: 140%; }
        }

        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 50px 120px rgba(168, 85, 247, 0.25),
                        inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: #ffffff;
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #a78bfa;
            font-size: 1.15rem;
            font-weight: 400;
            margin-bottom: 40px;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        /* زر بااااي النيون */
        .close-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #ffffff;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(236, 72, 153, 0.35);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .close-btn:hover {
            transform: scale(1.04) translateY(-3px);
            box-shadow: 0 20px 40px rgba(236, 72, 153, 0.55), 
                        0 0 20px rgba(139, 92, 246, 0.4);
        }

        .close-btn:active {
            transform: scale(0.97);
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .social-link {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 26px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transform: translateY(-4px);
        }

        .social-link.insta:hover {
            border-color: #ec4899;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.25);
        }

        .social-link.tele:hover {
            border-color: #38bdf8;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
        }

        @keyframes advancedCollapse {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
            50% { transform: scale(1.1) rotate(2deg); opacity: 0.5; filter: blur(5px); }
            100% { transform: scale(0.5) rotate(-5deg); opacity: 0; filter: blur(40px); }
        }

        .explode {
            animation: advancedCollapse 0.7s forwards cubic-bezier(0.55, 0.085, 0.68, 0.53);
        }

        .ios-toast {
            position: absolute;
            bottom: -100px;
            background: rgba(10, 5, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #f8fafc;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            transition: bottom 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .ios-toast.show {
            bottom: 45px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="glass-card" id="main-card">
        <h1>سيف علي</h1>
        <p class="subtitle">خلصنا امتحان</p>
        
        <button class="close-btn" onclick="closeAction()">
            بااااي
        </button>

        <div class="social-container">
            <a href="https://instagram.com/ne_7u" target="_blank" class="social-link insta">إنستغرام</a>
            <a href="https://t.me/wwgtr" target="_blank" class="social-link tele">تليغرام</a>
        </div>
    </div>

    <!-- الإشعار السفلي المحدث بالعبارة الجديدة -->
    <div class="ios-toast" id="toast">الحمد لله على كل شيء</div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 75;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const mouse = {
            x: null,
            y: null,
            radius: 160
        }

        function updateMouseCoords(x, y) {
            mouse.x = x;
            mouse.y = y;
        }

        window.addEventListener('mousemove', (e) => updateMouseCoords(e.x, e.y));
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                updateMouseCoords(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3.5 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                
                let rand = Math.random();
                if (rand < 0.4) this.color = 'rgba(236, 72, 153, 0.35)';
                else if (rand < 0.7) this.color = 'rgba(139, 92, 246, 0.3)';
                else this.color = 'rgba(56, 189, 248, 0.35)';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;

                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = forceDirectionX * force * 6;
                        let directionY = forceDirectionY * force * 6;
                        this.x -= directionX;
                        this.y -= directionY;
                    }
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 130) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(139, 92, 246, ${0.12 - (distance/130) * 0.12})`;
                        ctx.lineWidth = 0.9;
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(2, 1, 7, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animate);
        }

        init();
        animate();

        const card = document.getElementById('main-card');
        window.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 30;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 30;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg) translateZ(30px)`;
        });

        window.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg) translateZ(30px)`;
        });

        // الشاشة النهائية المعدلة بعبارة الحمد لله على كل شيء
        function closeAction() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');

            card.classList.add('explode');
            
            particlesArray.forEach(p => {
                p.speedX *= 12;
                p.speedY *= 12;
            });

            setTimeout(() => {
                document.body.innerHTML = `
                    <div style="color: #ffffff; font-size: 1.4rem; text-align: center; font-weight: 500; letter-spacing: 1px; text-shadow: 0 0 15px rgba(236,72,153,0.6); font-family: sans-serif;">
                        الحمد لله على كل شيء
                    </div>
                `;
                document.body.style.background = '#020107';
            }, 700);
        }
    </script>
</body>
</html>
