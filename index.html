<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيف علي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #1e1135 0%, #0b0518 70%, #020107 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* تأثير زجاج الآيفون الفاخر كلاسيفاي */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(18, 10, 36, 0.35);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(236, 72, 153, 0.15);
            border-radius: 28px;
            padding: 55px 45px;
            text-align: center;
            width: 90%;
            max-width: 430px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.2),
                        inset 0 -1px 20px rgba(168, 85, 247, 0.1);
            transform-style: preserve-3d;
            transform: translateZ(30px);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.12) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: lightGlow 6s infinite linear;
            pointer-events: none;
        }

        @keyframes lightGlow {
            0% { left: -60%; }
            100% { left: 140%; }
        }

        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 50px 120px rgba(168, 85, 247, 0.25),
                        inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: #ffffff;
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #a78bfa;
            font-size: 1.15rem;
            font-weight: 400;
            margin-bottom: 40px;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        .close-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #ffffff;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(236, 72, 153, 0.35);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .close-btn:hover {
            transform: scale(1.04) translateY(-3px);
            box-shadow: 0 20px 40px rgba(236, 72, 153, 0.55), 
                        0 0 20px rgba(139, 92, 246, 0.4);
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .social-link {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 26px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transform: translateY(-4px);
        }

        .social-link.insta:hover { border-color: #ec4899; box-shadow: 0 10px 25px rgba(236, 72, 153, 0.25); }
        .social-link.tele:hover { border-color: #38bdf8; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25); }

        @keyframes advancedCollapse {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
            100% { transform: scale(0.5) rotate(-5deg); opacity: 0; filter: blur(40px); }
        }

        .explode {
            animation: advancedCollapse 0.7s forwards cubic-bezier(0.55, 0.085, 0.68, 0.53);
        }

        /* حاوية تتر نهاية الفيلم */
        #movie-credits-wrapper {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: #020107;
            overflow: hidden;
            justify-content: center;
        }

        #credits-container {
            position: absolute;
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 2.4;
            transform: translateY(0px); 
        }

        .credit-title {
            color: #ec4899;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 40px;
            font-weight: 700;
        }

        .credit-name {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 500;
            text-shadow: 0 0 8px rgba(255,255,255,0.2);
            margin-bottom: 5px;
        }

        /* اسم بطل التتر: سيف علي */
        .star-saif {
            font-size: 2.6rem !important;
            font-weight: 900 !important;
            margin-top: 15px;
            margin-bottom: 40px !important;
            color: #ffffff !important;
            letter-spacing: 2px;
            text-shadow: -2px 1px 0 rgba(236, 72, 153, 0.5), 
                          2px -1px 0 rgba(56, 189, 248, 0.5),
                          0 0 10px rgba(255, 255, 255, 0.6);
        }

        .credit-name-en {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            letter-spacing: 1px;
            color: #e2e8f0;
            font-size: 1.15rem;
        }
    </style>
</head>
<body>

    <!-- عنصر الصوت المطور المخفي لتشغيل ملف 1.ogg -->
    <audio id="bg-music" src="1.ogg" loop preload="auto"></audio>

    <canvas id="bg-canvas"></canvas>

    <div id="movie-credits-wrapper">
        <div id="credits-container">
            <!-- التوليد البرمجي هنا -->
        </div>
    </div>

    <div class="glass-card" id="main-card">
        <h1>سيف علي</h1>
        <p class="subtitle">خلصنا امتحان</p>
        
        <button class="close-btn" onclick="startMovieCredits()">
            بااااي
        </button>

        <div class="social-container">
            <a href="https://instagram.com/ne_7u" target="_blank" class="social-link insta">إنستغرام</a>
            <a href="https://t.me/wwgtr" target="_blank" class="social-link tele">تليغرام</a>
        </div>
    </div>

    <script>
        // --- محرك الصوت ---
        const bgMusic = document.getElementById('bg-music');
        function tryPlayMusic() { 
            if (bgMusic.paused) { 
                bgMusic.play().catch(() => {}); 
            } 
        }
        window.addEventListener('mousemove', tryPlayMusic, { once: true });
        window.addEventListener('touchstart', tryPlayMusic, { once: true });

        // --- تأثير جزيئات الخلفية ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const numberOfParticles = 75;
        const mouse = { x: null, y: null, radius: 160 };

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', (e) => { if(e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3.5 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.4;
                this.color = Math.random() > 0.5 ? 'rgba(236, 72, 153, 0.35)' : 'rgba(56, 189, 248, 0.35)';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;

                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x -= (dx / distance) * force * 6; this.y -= (dy / distance) * force * 6;
                    }
                }
            }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); }
        }

        function init() { for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle()); }
        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x; let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 130) {
                        ctx.beginPath(); ctx.strokeStyle = `rgba(139, 92, 246, ${0.12 - (distance/130) * 0.12})`; ctx.lineWidth = 0.9;
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }

        let bgAnimationId;
        function animate() {
            ctx.fillStyle = 'rgba(2, 1, 7, 0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
            connectParticles(); bgAnimationId = requestAnimationFrame(animate);
        }
        init(); animate();

        const card = document.getElementById('main-card');
        window.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 30; let yAxis = (window.innerHeight / 2 - e.pageY) / 30;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg) translateZ(30px)`;
        });
        window.addEventListener('mouseleave', () => { card.style.transform = `rotateY(0deg) rotateX(0deg) translateZ(30px)`; });


        // --- الملاحم المعدلة والمصفاة ---
        const arabicStars = [
            "ضيم الفاينل", 
            "سحلة المد", 
            "الكوزات المفاجئة الطيرت النص درجة", 
            "التقارير المكتوبة بـ 4 الفجر", 
            "بحوث", 
            "قلق النتيجة والانتظار المقيت", 
            "مشاكل التلجرام والحظر للتلجرام", 
            "الملازم المتراكمة الما مفتوحة", 
            "هوسة النادي والسنتر", 
            "التبليغات الصادمة بنص الليل", 
            "حاسبة المعدل والبوينتات الطايرة", 
            "الضحك الهستيري ورا الامتحان من الصدمة", 
            "سوالف الممرات والتلزيك بالأجوبة", 
            "الرسوب التكتيكي الشريف", 
            "النجاح الـ دز بالدفعات", 
            "الغياب الجماعي المتفق عليه وسحبوا بينا ركبة", 
            "الإجازات المرضية المغشوشة", 
            "محاولات الغش السينمائية", 
            "رعب المراقبين والفرة بالقاعة", 
            "لحظة شطب الجواب الصح وكتابة الغلط", 
            "الدفتر الامتحاني والخرط البي", 
            "لحظة تسليم الدفتر والطلعة بروح"
        ];

        const enFirstNames = ["John", "Robert", "William", "David", "Richard", "Thomas", "Charles", "Christopher", "Daniel", "Matthew", "Anthony", "Mark", "Donald", "Steven", "Paul", "Andrew", "Joshua", "Kenneth", "Kevin", "Brian", "George", "Edward", "Ronald", "Timothy", "Jason", "Jeffrey", "Ryan", "Gary", "Jacob", "Nicholas", "Emma", "Olivia", "Ava", "Isabella", "Sophia", "Mia", "Charlotte", "Amelia", "Harper", "Evelyn"];
        const enLastNames = ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis", "Rodriguez", "Martinez", "Hernandez", "Lopez", "Gonzalez", "Wilson", "Anderson", "Thomas", "Taylor", "Moore", "Jackson", "Martin", "Lee", "Perez", "Thompson", "White", "Harris", "Sanchez", "Clark", "Ramirez", "Lewis", "Robinson", "Walker", "Young", "Allen", "King", "Wright", "Scott", "Torres", "Nguyen", "Hill", "Flores"];
        const enRoles = ["Executive Producer", "Line Producer", "Director of Photography", "Lead VFX Artist", "Sound Recordist", "Supervising Sound Editor", "Key Gaffer", "Best Boy Electric", "Set Decorator", "Costume Supervisor", "Property Master", "Lead Editor", "Colorist", "Script Supervisor", "Stunt Coordinator", "Casting Associate", "Catering Manager", "Transportation Captain", "Publicist", "Foley Artist"];

        const container = document.getElementById('credits-container');

        function generateInitialCredits() {
            let html = `<div style="font-size: 2.5rem; font-weight: 800; color: #ffffff; margin-bottom: 60px; letter-spacing: 3px;">نـهـايـة الامـتـحـانـات</div>`;
            
            html += `<div class="credit-title">بطولة مطلقة للـنـجـم</div>`;
            html += `<div class="credit-name star-saif">سيف علي</div>`;

            html += `<div class="credit-title" style="margin-top: 20px;">وباشتراك عناصر الملحمة</div>`;
            arabicStars.forEach(star => { html += `<div class="credit-name">${star}</div>`; });

            for(let i=0; i<30; i++) {
                html += generateRandomEnglishCredit();
            }

            container.innerHTML = html;
        }

        function generateRandomEnglishCredit() {
            let role = enRoles[Math.floor(Math.random() * enRoles.length)];
            let fName = enFirstNames[Math.floor(Math.random() * enFirstNames.length)];
            let lName = enLastNames[Math.floor(Math.random() * enLastNames.length)];
            return `<div class="credit-title">${role}</div><div class="credit-name credit-name-en">${fName} ${lName}</div>`;
        }

        function startMovieCredits() {
            bgMusic.play().catch(() => { console.log("Audio play deferred."); }); 
            card.classList.add('explode');
            generateInitialCredits();

            setTimeout(() => {
                card.style.display = 'none';
                cancelAnimationFrame(bgAnimationId);
                canvas.style.display = 'none';

                const wrapper = document.getElementById('movie-credits-wrapper');
                wrapper.style.display = 'flex';

                let currentY = window.innerHeight;
                container.style.transform = `translateY(${currentY}px)`;

                function scrollLoop() {
                    currentY -= 1.1; 
                    container.style.transform = `translateY(${currentY}px)`;

                    let containerHeight = container.offsetHeight;
                    if (Math.abs(currentY) + window.innerHeight > containerHeight - 400) {
                        for(let k=0; k<15; k++) {
                            container.insertAdjacentHTML('beforeend', generateRandomEnglishCredit());
                        }
                    }

                    requestAnimationFrame(scrollLoop);
                }
                requestAnimationFrame(scrollLoop);

            }, 600);
        }
    </script>
</body>
</html>
