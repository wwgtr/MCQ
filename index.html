<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيف علي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #1e1135 0%, #0b0518 70%, #020107 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* تأثير زجاج الآيفون الفاخر كلاسيفاي */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(18, 10, 36, 0.35);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(236, 72, 153, 0.15);
            border-radius: 28px;
            padding: 55px 45px;
            text-align: center;
            width: 90%;
            max-width: 430px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.2),
                        inset 0 -1px 20px rgba(168, 85, 247, 0.1);
            transform-style: preserve-3d;
            transform: translateZ(30px);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.12) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: lightGlow 6s infinite linear;
            pointer-events: none;
        }

        @keyframes lightGlow {
            0% { left: -60%; }
            100% { left: 140%; }
        }

        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 50px 120px rgba(168, 85, 247, 0.25),
                        inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: #ffffff;
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #a78bfa;
            font-size: 1.15rem;
            font-weight: 400;
            margin-bottom: 40px;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        .close-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #ffffff;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(236, 72, 153, 0.35);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .close-btn:hover {
            transform: scale(1.04) translateY(-3px);
            box-shadow: 0 20px 40px rgba(236, 72, 153, 0.55), 
                        0 0 20px rgba(139, 92, 246, 0.4);
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .social-link {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 26px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transform: translateY(-4px);
        }

        .social-link.insta:hover { border-color: #ec4899; box-shadow: 0 10px 25px rgba(236, 72, 153, 0.25); }
        .social-link.tele:hover { border-color: #38bdf8; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25); }

        @keyframes advancedCollapse {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
            100% { transform: scale(0.5) rotate(-5deg); opacity: 0; filter: blur(40px); }
        }

        .explode {
            animation: advancedCollapse 0.7s forwards cubic-bezier(0.55, 0.085, 0.68, 0.53);
        }

        /* حاوية التتر السينمائي المطور */
        #movie-credits-wrapper {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: #020107;
            overflow: hidden;
            justify-content: center;
        }

        #credits-container {
            position: absolute;
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 2.4;
            top: 100%;
        }

        .credit-title {
            color: #ec4899;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 40px;
            font-weight: 700;
        }

        .credit-name {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 500;
            text-shadow: 0 0 8px rgba(255,255,255,0.2);
            margin-bottom: 5px;
        }

        .credit-name-en {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            letter-spacing: 1px;
            color: #e2e8f0;
            font-size: 1.15rem;
        }

        .final-thanks {
            font-size: 2.2rem;
            color: #ffffff;
            font-weight: 700;
            margin-top: 100px;
            margin-bottom: 250px;
            background: linear-gradient(135deg, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(139,92,246,0.6);
        }
    </style>
</head>
<body>

    <!-- عنصر الصوت المطور المخفي لتشغيل ملف 1.ogg -->
    <audio id="bg-music" src="1.ogg" loop preload="auto"></audio>

    <canvas id="bg-canvas"></canvas>

    <div id="movie-credits-wrapper">
        <div id="credits-container">
            <!-- التوليد البرمجي هنا -->
        </div>
    </div>

    <div class="glass-card" id="main-card">
        <h1>سيف علي</h1>
        <p class="subtitle">خلصنا امتحان</p>
        
        <button class="close-btn" onclick="startMovieCredits()">
            بااااي
        </button>

        <div class="social-container">
            <a href="https://instagram.com/ne_7u" target="_blank" class="social-link insta">إنستغرام</a>
            <a href="https://t.me/wwgtr" target="_blank" class="social-link tele">تليغرام</a>
        </div>
    </div>

    <script>
        // --- محرك الصوت الذكي لتخطي قيود المتصفحات وسفاري ---
        const bgMusic = document.getElementById('bg-music');
        
        function tryPlayMusic() {
            if (bgMusic.paused) {
                bgMusic.play().catch(err => {
                    // تم منع التشغيل التلقائي مؤقتاً، سينتظر المتصفح أول لمسة أو حركة
                    console.log("Waiting for user interaction to blast music...");
                });
            }
        }

        // تفعيل تشغيل الصوت تلقائياً بمجرد حدوث أي حركة لمس أو تفاعل على الشاشة
        window.addEventListener('mousemove', tryPlayMusic, { once: true });
        window.addEventListener('touchstart', tryPlayMusic, { once: true });
        window.addEventListener('click', tryPlayMusic, { once: true });


        // --- تأثير جزيئات الخلفية التفاعلية ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const numberOfParticles = 75;
        const mouse = { x: null, y: null, radius: 160 };

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', (e) => { if(e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; } });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3.5 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                let rand = Math.random();
                if (rand < 0.4) this.color = 'rgba(236, 72, 153, 0.35)';
                else if (rand < 0.7) this.color = 'rgba(139, 92, 246, 0.3)';
                else this.color = 'rgba(56, 189, 248, 0.35)';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;

                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x -= (dx / distance) * force * 6;
                        this.y -= (dy / distance) * force * 6;
                    }
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function init() { for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle()); }

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 130) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(139, 92, 246, ${0.12 - (distance/130) * 0.12})`;
                        ctx.lineWidth = 0.9;
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        let bgAnimationId;
        function animate() {
            ctx.fillStyle = 'rgba(2, 1, 7, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
            connectParticles();
            bgAnimationId = requestAnimationFrame(animate);
        }
        init();
        animate();

        const card = document.getElementById('main-card');
        window.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 30;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 30;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg) translateZ(30px)`;
        });
        window.addEventListener('mouseleave', () => { card.style.transform = `rotateY(0deg) rotateX(0deg) translateZ(30px)`; });


        // --- السيناريو السينمائي الجامعي القدير ---
        const arabicStars = ["الفاينل", "المد", "كوزات", "تقارير", "بحوث", "مناقشات", "رسوب", "نجاح", "غياب", "اجايز", "غش", "مشاكل", "سوالف", "ضحك"];
        const enRoles = ["Executive Producers", "Director of Photography", "Visual Effects Supervisors", "Production Designers", "Sound Engineers", "Stunt Coordinators", "Casting Directors", "Post-Production Crew"];
        const enNames = [
            "James Anderson", "Oliver Smith", "Liam Johnson", "Lucas Williams", "Benjamin Brown", 
            "Mason Jones", "Ethan Garcia", "Alexander Miller", "Henry Davis", "Sebastian Rodriguez",
            "Jack Martinez", "Samuel Hernandez", "Owen Lopez", "David Gonzalez", "Matthew Wilson",
            "Joseph Anderson", "Jackson Thomas", "Emma Taylor", "Sophia Moore", "Mia Jackson",
            "Charlotte Martin", "Amelia Lee", "Harper Perez", "Evelyn Thompson", "Abigail White",
            "Emily Harris", "Elizabeth Sanchez", "Avery Clark", "Sofia Ramirez", "Ella Lewis",
            "Madison Robinson", "Scarlett Walker", "Victoria Young", "Aria Allen", "Grace King"
        ];

        function generateCredits() {
            const container = document.getElementById('credits-container');
            let html = `<div style="font-size: 2.5rem; font-weight: 800; color: #ffffff; margin-bottom: 60px; letter-spacing: 3px;">نـهـايـة الامـتـحـانـات</div>`;
            
            html += `<div class="credit-title">بطولة</div>`;
            arabicStars.forEach(star => { html += `<div class="credit-name">${star}</div>`; });

            let nameIndex = 0;
            for (let i = 0; i < 75; i++) {
                if (i % 8 === 0) {
                    let role = enRoles[Math.floor(i / 8) % enRoles.length];
                    html += `<div class="credit-title">${role}</div>`;
                }
                let name1 = enNames[nameIndex % enNames.length];
                let name2 = enNames[(nameIndex + 4) % enNames.length].split(' ')[1];
                html += `<div class="credit-name credit-name-en">${name1.split(' ')[0]} ${name2}</div>`;
                nameIndex++;
            }

            html += `<div class="final-thanks">الحمد لله على كل شيء</div>`;
            container.innerHTML = html;
        }

        function startMovieCredits() {
            // للتأكيد في حال لم تعمل الموسيقى مسبقاً، ستعمل إجبارياً وبأعلى صوت عند ضغط الزر
            bgMusic.play(); 

            card.classList.add('explode');
            generateCredits();

            setTimeout(() => {
                card.style.display = 'none';
                cancelAnimationFrame(bgAnimationId);
                canvas.style.display = 'none';

                const wrapper = document.getElementById('movie-credits-wrapper');
                const container = document.getElementById('credits-container');
                wrapper.style.display = 'flex';

                let currentTop = window.innerHeight;
                
                function scrollCredits() {
                    currentTop -= 1.0; 
                    container.style.top = currentTop + 'px';

                    if (currentTop > -container.offsetHeight) {
                        requestAnimationFrame(scrollCredits);
                    }
                }
                requestAnimationFrame(scrollCredits);

            }, 600);
        }
    </script>
</body>
</html>
